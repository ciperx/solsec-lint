[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solsec-lint"
version = "1.0.0"
description = "Self-contained static security linter for Solidity (reentrancy, unchecked calls, tx.origin, arithmetic, initializers, access control, delegatecall)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "solsec-lint contributors" }]
keywords = ["solidity", "security", "static-analysis", "smart-contracts", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
solsec-lint = "solsec.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["solsec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
